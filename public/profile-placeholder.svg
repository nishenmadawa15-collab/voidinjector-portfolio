<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a10"/>
      <stop offset="100%" stop-color="#050806"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00FF55" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00FF55" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2818"/>
      <stop offset="100%" stop-color="#06140c"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00FF55" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="320" height="400" fill="url(#bg)"/>
  <!-- Hooded figure -->
  <ellipse cx="160" cy="145" rx="58" ry="62" fill="url(#hood)"/>
  <!-- Face shadow -->
  <ellipse cx="160" cy="155" rx="32" ry="36" fill="#020503" opacity="0.9"/>
  <!-- Green eye glow -->
  <ellipse cx="148" cy="152" rx="4" ry="2.5" fill="#00FF55" opacity="0.85">
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="172" cy="152" rx="4" ry="2.5" fill="#00FF55" opacity="0.85">
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Hood drape -->
  <path d="M95 160 Q100 90 160 75 Q220 90 225 160 Q200 145 160 150 Q120 145 95 160" fill="#0a1f14"/>
  <path d="M70 400 Q70 240 160 220 Q250 240 250 400" fill="url(#hood)"/>
  <!-- Shoulders -->
  <path d="M80 280 Q100 250 160 245 Q220 250 240 280 L250 400 L70 400 Z" fill="#07140c" opacity="0.9"/>
  <!-- Digital overlay -->
  <rect width="320" height="400" fill="url(#scan)"/>
  <rect width="320" height="400" fill="url(#glow)"/>
  <!-- Matrix-ish dots -->
  <g fill="#00FF55" opacity="0.15" font-family="monospace" font-size="8">
    <text x="20" y="40">01</text>
    <text x="280" y="60">10</text>
    <text x="30" y="360">0x</text>
    <text x="260" y="380">FF</text>
  </g>
  <!-- Border frame -->
  <rect x="1" y="1" width="318" height="398" stroke="#0a6b32" stroke-width="2" fill="none"/>
</svg>
